# Render 免费层部署蓝图（部署手册见 docs/deploy.md「免费云部署」一节）
# 后端：Docker web service（512MB，休眠唤醒）+ 前端：static site（全球 CDN，不休眠）
# 数据库：TiDB Cloud Starter 免费集群（MySQL 兼容），连接串整串注入 DB_URL
services:
  - type: web
    name: idonhve-whoami-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /admin/api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DB_POOL_MAX
        value: "6"
      - key: DB_POOL_MIN_IDLE
        value: "2"
      - key: TOMCAT_THREADS_MAX
        value: "50"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"

  - type: web
    name: idonhve-whoami
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
