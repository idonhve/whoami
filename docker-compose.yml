name: whoami

services:
  mysql:
    image: mysql:8.0
    container_name: whoami-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（复制 .env.example 为 .env）}
      MYSQL_DATABASE: whoami
      MYSQL_USER: ${DB_USER:-whoami}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（复制 .env.example 为 .env）}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s

  backend:
    build: ./backend
    container_name: whoami-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: whoami
      DB_USER: ${DB_USER:-whoami}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（复制 .env.example 为 .env）}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（至少 32 字符的随机串）}
      TZ: ${TZ:-Asia/Shanghai}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/admin/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  frontend:
    build: ./frontend
    container_name: whoami-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  uploads:
