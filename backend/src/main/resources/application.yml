spring:
  application:
    name: whoami-backend
  # 本地从 IDEA / mvn 直接启动时自动读取根目录 .env（docker compose 场景注入的真实环境变量优先级更高）
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    # DB_URL 整串覆盖（云数据库直连，如 TiDB：sslMode=VERIFY_IDENTITY）；本地/容器走默认拼装
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:whoami}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USER:whoami}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # 容器层上传上限（Spec 07 简历 PDF ≤ 20MB）；各模块业务上限更严（Spec 08 证书图片 ≤ 5MB），由业务校验给出精确 400
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080
  tomcat:
    threads:
      # 默认 200；小内存容器（如 512MB 免费层）通过环境变量调小
      max: ${TOMCAT_THREADS_MAX:200}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET:}
    expires-in-seconds: ${JWT_EXPIRES_IN:7200}
  cors:
    # 前后端分域部署时放行前端来源（逗号分隔）；同源部署（docker compose/nginx）无需放行也无害
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost}
  github:
    # PAT 只勾选只读公开仓库权限（public_repo），只注入后端，不下发前端
    token: ${GITHUB_TOKEN:}
    owner: ${GITHUB_OWNER:}
    api-base: ${GITHUB_API_BASE:https://api.github.com}
